<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caravan Asset Lab</title>
<style>
  :root { --ink: #2a1f1a; --paper: #fffdf7; --accent: #d9322b; --muted: #6b5d52; --sea: #0a8fd6; --line: #e5dccd; }
  * { box-sizing: border-box; }
  /* Single-look page by design: white "print paper" behind ligne-claire art, in any theme. */
  :root { color-scheme: light; }
  html, body { margin: 0; height: 100%; background: #ffffff; color: var(--ink); font: 14px/1.4 "Trebuchet MS", "Segoe UI", system-ui, sans-serif; }
  #app { position: fixed; inset: 0; display: grid; grid-template-rows: auto 1fr; grid-template-columns: 1fr 300px; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: #fff; }
  header { grid-column: 1 / -1; display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 2.5px solid var(--ink); background: var(--paper); }
  h1 { margin: 0; font-size: 18px; letter-spacing: .3px; white-space: nowrap; }
  h1 span { color: var(--muted); font-weight: normal; font-size: 14px; }
  .group { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
  .fam { display: inline-flex; gap: 3px; align-items: center; padding-right: 6px; }
  .fam b { font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-right: 2px; }
  button { font: inherit; font-weight: bold; color: var(--ink); background: #fff; border: 2px solid var(--ink); border-radius: 999px; padding: 4px 12px; cursor: pointer; box-shadow: 0 2px 0 var(--ink); min-height: 32px; }
  button.chip { padding: 2px 9px; min-width: 32px; }
  button.on { background: var(--accent); color: #fff; }
  button.go { background: var(--ink); color: #fff; }
  button:focus-visible { outline: 3px solid #3f62a8; outline-offset: 2px; }
  button:active { transform: translateY(2px); box-shadow: none; }
  button:disabled { opacity: .45; cursor: default; }
  .seg { display: inline-flex; }
  .seg button { border-radius: 0; margin-left: -2px; }
  .seg button:first-child { border-radius: 999px 0 0 999px; margin-left: 0; }
  .seg button:last-child { border-radius: 0 999px 999px 0; }
  #stage { position: relative; min-width: 0; min-height: 0; }
  #view { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; cursor: grab; }
  #labels { position: absolute; inset: 0; pointer-events: none; overflow: hidden; }
  #labels div { position: absolute; transform: translate(-100%, -50%); font-size: 12px; font-weight: bold; background: var(--paper); border: 1.5px solid var(--ink); border-radius: 6px; padding: 1px 6px; white-space: nowrap; }
  #panel { border-left: 2.5px solid var(--ink); background: var(--paper); overflow: auto; padding: 12px 14px 20px; padding-right: max(14px, env(safe-area-inset-right, 0px)); }
  #panel h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .6px; margin: 14px 0 6px; color: var(--muted); }
  #panel h2:first-child { margin-top: 0; }
  #summary { font-size: 13px; color: var(--muted); }
  #layers { list-style: none; margin: 0; padding: 0; }
  #layers li { display: flex; align-items: center; gap: 8px; padding: 3px 4px; border-radius: 6px; cursor: pointer; }
  #layers li:hover, #layers li.sel { background: #f3ead9; }
  #layers li.part { padding-left: 26px; font-size: 13px; }
  #layers li.head { cursor: default; font-weight: bold; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; margin-top: 8px; background: none; }
  #layers input { width: 16px; height: 16px; accent-color: var(--accent); margin: 0; }
  #layers .k { margin-left: auto; font-size: 11px; color: var(--muted); }
  #status { position: absolute; left: calc(12px + env(safe-area-inset-left, 0px)); bottom: 10px; font: 12px ui-monospace, Menlo, monospace; background: rgba(255,253,247,.92); border: 1.5px solid var(--ink); border-radius: 8px; padding: 4px 8px; max-width: calc(100% - 24px); }
  a { color: var(--sea); }
  @media (max-width: 760px) {
    #app { grid-template-columns: 1fr; grid-template-rows: auto minmax(0, 1fr) 34vh; }
    #panel { border-left: 0; border-top: 2.5px solid var(--ink); }
  }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Caravan <span>· asset lab</span></h1>
    <div class="group" id="tiles"></div>
    <div class="group">
      <span class="seg" id="version"><button data-v="1">Original</button><button data-v="2">Cut-out</button><button data-v="3" class="on">Generated</button><button data-v="4">Pixel</button></span>
      <button id="build" class="go">▶ Build</button>
      <button id="explode">Explode</button>
      <button id="sound">🔇 Sound</button>
    </div>
  </header>
  <div id="stage"><canvas id="view"></canvas><div id="labels"></div><div id="status">loading layers…</div></div>
  <aside id="panel">
    <h2>Tile</h2>
    <div id="summary"></div>
    <h2>Layers</h2>
    <ul id="layers"></ul>
  </aside>
</div>
<script src="dist/lab.js"></script>
</body>
</html>
