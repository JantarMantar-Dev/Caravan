<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Caravan Hex Preview</title>
<style>
  :root { --ink: #2a1f1a; --paper: #fffdf7; --accent: #d9322b; --muted: #6b5d52; }
  * { box-sizing: border-box; }
  /* Single-look page by design: white "print paper" behind ligne-claire art, in any theme. */
  :root { color-scheme: light; }
  html, body { margin: 0; height: 100%; background: #ffffff; color: var(--ink); font: 14px/1.4 "Trebuchet MS", "Segoe UI", system-ui, sans-serif; }
  #app { position: fixed; inset: 0; display: flex; flex-direction: column; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: #ffffff; }
  header { display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; padding-block: 10px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); border-bottom: 2.5px solid var(--ink); background: var(--paper); }
  h1 { margin: 0; font-size: 18px; letter-spacing: .3px; }
  h1 span { color: var(--muted); font-weight: normal; font-size: 14px; }
  #tabs { display: flex; flex-wrap: wrap; gap: 6px; }
  #tabs button { font: inherit; font-weight: bold; color: var(--ink); background: #fff; border: 2px solid var(--ink); border-radius: 999px; padding: 4px 12px; cursor: pointer; box-shadow: 0 2px 0 var(--ink); }
  #tabs button.on { background: var(--accent); color: #fff; }
  #tabs button:focus-visible { outline: 3px solid #3f62a8; outline-offset: 2px; }
  #tabs button:active { transform: translateY(2px); box-shadow: none; }
  #view { flex: 1; width: 100%; min-height: 0; display: block; touch-action: none; cursor: grab; }
  #view:active { cursor: grabbing; }
  #stats { position: fixed; left: calc(12px + env(safe-area-inset-left, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); font: 12px ui-monospace, Menlo, monospace; background: rgba(255,253,247,.92); border: 1.5px solid var(--ink); border-radius: 8px; padding: 4px 8px; max-width: calc(100% - 24px); }
  #hint { position: fixed; right: calc(12px + env(safe-area-inset-right, 0px)); bottom: calc(10px + env(safe-area-inset-bottom, 0px)); font-size: 12px; color: var(--muted); }
  @media (max-width: 600px) { #hint { display: none; } }
  /* ?score: bare canvas at 1 css px per sheet px, for the scoring harness */
  body.bare header, body.bare #stats, body.bare #hint { display: none; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Caravan <span>· hex asset preview</span></h1>
    <nav id="tabs"></nav>
  </header>
  <canvas id="view"></canvas>
</div>
<div id="stats">baking art…</div>
<div id="hint">drag to pan · scroll to zoom</div>
<script src="dist/main.js"></script>
</body>
</html>
